<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Chatbot</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            padding-top:40px;
        }

        .container{
            width:700px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#2c3e50;
        }

        form{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        input{
            flex:1;
            padding:12px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            padding:12px 20px;
            background:#3498db;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .chat-box{
            margin-top:20px;
        }

        .user{
            background:#d6eaf8;
            padding:12px;
            border-radius:8px;
            margin-bottom:10px;
        }

        .bot{
            background:#e8f8f5;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Medical Chatbot</h1>

        <form method="POST">

            <input
                type="text"
                name="question"
                placeholder="Ask your medical question..."
                required
            >

            <button type="submit">
                Ask
            </button>

        </form>

        <div class="chat-box">

            {% for chat in chat_history %}

                <div class="user">
                    <strong>You:</strong>
                    {{ chat.question }}
                </div>

                <div class="bot">
                    <strong>Bot:</strong>
                    {{ chat.response }}
                </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
